name: E2E smoke (Playwright + Obsidian)

# Real Obsidian window driven by Playwright over CDP. Heavier than
# unit/integration tests (~3-5 min for Electron boot + scenarios),
# but on the merge path: the previous nightly-cron + continue-on-
# error setup hid 3+ days of fake-green where every smoke test was
# silently skipping because Obsidian's window never booted. Per-PR
# trigger with paths-filter keeps the cost off docs PRs while
# putting real failures in front of the author.
#
# Prerequisites satisfied by the job itself:
#   - Obsidian AppImage (downloaded + cached)
#   - Docker test sshd (same container as integration.yml)
#   - Plugin build (esbuild production)
#   - Server build (Go cross-compile, linux/amd64)
#
# The Obsidian AppImage is freely downloadable; this workflow uses
# it for automated testing of a community plugin. If upstream
# objects, switch to a stub Electron shell that loads the plugin
# without the full Obsidian chrome.

on:
  pull_request:
    # Both release branches. `next` is where features (and the
    # connect-lifecycle / connect-failure specs) land first — gating
    # it here is what stops a broken connect reaching stable again
    # (1.0.49 shipped connect-broken because nothing exercised the
    # real connect path on a next PR). Mark "Obsidian E2E smoke" as a
    # required check on next in branch protection to make it binding.
    branches: [main, next]
    paths:
      # Plugin or daemon source — anything that could change the
      # Obsidian-side behaviour the spec drives.
      - 'plugin/src/**'
      - 'plugin/e2e/**'
      - 'plugin/package.json'
      - 'plugin/package-lock.json'
      - 'plugin/esbuild.config.mjs'
      - 'plugin/playwright.config.ts'
      - 'plugin/tsconfig.json'
      - 'server/**'
      # Docker test sshd or seeded fixtures — the remote vault
      # contents the spec asserts against.
      - 'docker/test-sshd/**'
      - 'docker/test-vault/**'
      - 'docker-compose.yml'
      # The workflow itself.
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    # Weekly deep run (Sundays 03:00 UTC = 12:00 JST). Per-PR is the
    # primary gate; this catches environment drift that doesn't go
    # through a PR — e.g. the Obsidian AppImage URL silently
    # breaking, the docker base image updating, or ssh2 deprecating
    # an option. Weekly (not nightly) keeps cost minimal while still
    # flagging rot within a week of it landing.
    - cron: '0 3 * * 0'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Obsidian E2E smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build plugin
        run: node esbuild.config.mjs production

      - name: Build server daemon
        run: npm run build:server

      - name: Bring up test sshd
        run: npm run sshd:start

      # Download and cache the Obsidian AppImage. Cache key v2: v1
      # was poisoned by a curl run that saved a "Not Found" HTML body
      # as Obsidian.AppImage (no `-f`), which then broke every later
      # run that hit the cache.
      - name: Cache Obsidian AppImage
        id: obsidian-cache
        uses: actions/cache@v6
        with:
          path: ~/obsidian/Obsidian.AppImage
          key: obsidian-appimage-1.8.9-v2

      - name: Download Obsidian AppImage
        if: steps.obsidian-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/obsidian
          # `-f` makes curl exit non-zero on HTTP 4xx/5xx instead of
          # writing the error body to disk.
          curl -fL -o ~/obsidian/Obsidian.AppImage \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.8.9/Obsidian-1.8.9.AppImage" \
            || curl -fL -o ~/obsidian/Obsidian.AppImage \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.7.7/Obsidian-1.7.7.AppImage"
          chmod +x ~/obsidian/Obsidian.AppImage

      - name: Verify AppImage is a real ELF binary
        run: |
          file ~/obsidian/Obsidian.AppImage
          file ~/obsidian/Obsidian.AppImage | grep -q 'ELF .* executable'

      - name: Extract AppImage (no FUSE in CI)
        run: |
          cd ~/obsidian
          ./Obsidian.AppImage --appimage-extract
          ls -la squashfs-root/

      # Xvfb for headless Electron
      - name: Start Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run E2E smoke tests
        # No continue-on-error: now that this runs per-PR, hidden
        # failures need to surface as red status checks rather than
        # be quietly logged in nightly artifacts no one watches.
        env:
          OBSIDIAN_PATH: ~/obsidian/squashfs-root/obsidian
          DISPLAY: ':99'
        run: npm run test:e2e

      - name: Tear down test sshd
        if: always()
        run: npm run sshd:stop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}
          path: plugin/e2e-results/
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: plugin/test-results/
          retention-days: 14
