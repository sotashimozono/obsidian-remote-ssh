name: Version check

# Branch-aware version-bump enforcement for the two-channel release
# model:
#
#   • PR into `next`  → BETA channel.  head version must be `X.Y.Z-beta.N`
#                       (strictly greater than base, semver-aware), and
#                       only the beta-channel artefacts (plugin/manifest.json
#                       + manifest-beta.json) may have moved.  manifest.json
#                       (root) and versions.json must stay pinned to the
#                       last stable so the Obsidian Community Plugins store
#                       isn't accidentally advanced to a prerelease.
#
#   • PR into `main`  → STABLE channel.  head version must be plain
#                       `X.Y.Z` (no -beta suffix), strictly greater than
#                       base, and ALL manifest files must agree (a stable
#                       release supersedes the previous beta on every
#                       channel).
#
# The release-on-merge workflow tags using `plugin/manifest.json`, so a
# same-or-lower version would either fail to tag or silently re-tag an
# existing release.  The semver compare uses Node so prerelease ordering
# (`1.0.44-beta.10` > `1.0.44-beta.2`, `1.0.44` > `1.0.44-beta.N`) is
# handled correctly.

on:
  pull_request:
    branches: [main, next]

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    # NOTE: the JOB always runs so it produces a `success` check-run.
    # Branch protection lists this as a required check, and a
    # job-level `if:` would cause GitHub to omit the check entirely
    # ("expected but missing" → merge blocked). We instead skip at
    # the STEP level for auto-generated PRs: no real work happens,
    # but the empty job still reports green.
    #
    # Three PR shapes are skipped:
    #   1. head_ref == 'main' — the auto-opened main → next sync PR
    #      from sync-main-to-next.yml.
    #   2. head_ref starts with 'chore/sync-main-to-next' — a manual
    #      conflict-resolution PR opened when (1) hits conflicts.
    #   3. actor == 'dependabot[bot]' — dependency-bump PRs carry no
    #      plugin version change by design.
    steps:
      - name: Detect auto-generated PR (sync or Dependabot)
        id: sync_check
        run: |
          if [[ "${{ github.head_ref }}" == "main" ]] \
            || [[ "${{ github.head_ref }}" == chore/sync-main-to-next* ]] \
            || [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "is_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip note (auto-generated PRs)
        if: steps.sync_check.outputs.is_sync == 'true'
        run: echo "Auto-generated PR (actor=${{ github.actor }}, head=${{ github.head_ref }}) — version-check is a no-op."

      - if: steps.sync_check.outputs.is_sync != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need both branches for `git show`

      - name: Resolve versions
        id: versions
        if: steps.sync_check.outputs.is_sync != 'true'
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          git fetch origin "$base_ref" --depth=1

          # head versions
          head_manifest=$(jq -r '.version' plugin/manifest.json)
          head_package=$(jq -r '.version' plugin/package.json)
          head_root=$(jq -r '.version' manifest.json)
          head_beta=$(jq -r '.version' manifest-beta.json)

          # base versions for comparison and "must not change" checks
          base_manifest=$(git show "origin/${base_ref}:plugin/manifest.json" | jq -r '.version')
          base_root=$(git show "origin/${base_ref}:manifest.json" | jq -r '.version')

          echo "base_ref=$base_ref"               >> "$GITHUB_OUTPUT"
          echo "head_manifest=$head_manifest"     >> "$GITHUB_OUTPUT"
          echo "head_package=$head_package"       >> "$GITHUB_OUTPUT"
          echo "head_root=$head_root"             >> "$GITHUB_OUTPUT"
          echo "head_beta=$head_beta"             >> "$GITHUB_OUTPUT"
          echo "base_manifest=$base_manifest"     >> "$GITHUB_OUTPUT"
          echo "base_root=$base_root"             >> "$GITHUB_OUTPUT"

          echo "base manifest.json (plugin):     $base_manifest"
          echo "head manifest.json (plugin):     $head_manifest"
          echo "head package.json:               $head_package"
          echo "head manifest.json (root):       $head_root"
          echo "head manifest-beta.json (root):  $head_beta"
          echo "base manifest.json (root):       $base_root"
          echo "PR base branch:                  $base_ref"

      - name: plugin/manifest.json and plugin/package.json must agree
        if: steps.sync_check.outputs.is_sync != 'true'
        run: |
          if [ "${{ steps.versions.outputs.head_manifest }}" \
            != "${{ steps.versions.outputs.head_package }}" ]; then
            echo "::error::plugin/manifest.json (${{ steps.versions.outputs.head_manifest }})"\
              " and plugin/package.json (${{ steps.versions.outputs.head_package }}) disagree."\
              " Run 'cd plugin && npm version <X.Y.Z[-beta.N]>' to bump both at once."
            exit 1
          fi

      - name: plugin/manifest.json and manifest-beta.json (root) must agree
        # The bundled manifest is what we ship; manifest-beta.json (root) is
        # what BRAT --beta consumers fetch. They must always match — both
        # carry the latest version, whether beta or stable.
        if: steps.sync_check.outputs.is_sync != 'true'
        run: |
          if ! diff -q plugin/manifest.json manifest-beta.json > /dev/null; then
            echo "::error::manifest-beta.json content differs from plugin/manifest.json."\
              " Re-run 'cd plugin && npm version <same>' (the bump script syncs both)."
            diff plugin/manifest.json manifest-beta.json || true
            exit 1
          fi

      # ─── Branch-specific assertions ─────────────────────────────────────

      - name: BETA channel (PR → next) — root manifest.json must stay pinned
        # On a beta PR the Obsidian Community Plugins store manifest must NOT
        # move; only manifest-beta.json + plugin/manifest.json may advance.
        # Also exclude sync-shape PRs since those legitimately carry main's
        # stable version state into next.
        if: github.base_ref == 'next' && steps.sync_check.outputs.is_sync != 'true'
        run: |
          if [ "${{ steps.versions.outputs.head_root }}" != "${{ steps.versions.outputs.base_root }}" ]; then
            echo "::error::Beta PRs must not modify root manifest.json."\
              " Got head=${{ steps.versions.outputs.head_root }}, base=${{ steps.versions.outputs.base_root }}."\
              " Use 'npm version prerelease --preid=beta' (or 'prepatch --preid=beta' to start a new cycle) — these only touch the beta-channel files."
            exit 1
          fi
          # versions.json (both copies) is the stable compatibility map
          # and must also stay frozen on beta PRs.
          if ! git diff --quiet "origin/${{ steps.versions.outputs.base_ref }}" -- versions.json plugin/versions.json; then
            echo "::error::Beta PRs must not modify versions.json."\
              " The compatibility map only advances on stable releases."
            git diff "origin/${{ steps.versions.outputs.base_ref }}" -- versions.json plugin/versions.json || true
            exit 1
          fi

      - name: STABLE channel (PR → main) — head version must be plain X.Y.Z
        if: github.base_ref == 'main' && steps.sync_check.outputs.is_sync != 'true'
        run: |
          head="${{ steps.versions.outputs.head_manifest }}"
          if [[ "$head" == *-beta.* ]]; then
            echo "::error::PRs into main must carry a plain stable version (X.Y.Z), got '$head'."\
              " Strip the -beta.N suffix on next first: 'cd plugin && npm version <X.Y.Z>' (e.g. 1.0.44)."
            exit 1
          fi
          # All three manifests must agree on a stable PR.
          if ! diff -q plugin/manifest.json manifest.json > /dev/null; then
            echo "::error::Stable PRs require plugin/manifest.json == manifest.json (root)."
            diff plugin/manifest.json manifest.json || true
            exit 1
          fi
          if ! diff -q plugin/versions.json versions.json > /dev/null; then
            echo "::error::Stable PRs require plugin/versions.json == versions.json (root)."
            diff plugin/versions.json versions.json || true
            exit 1
          fi

      - name: PR version must be strictly greater than base (semver-aware)
        if: steps.sync_check.outputs.is_sync != 'true'
        env:
          BASE_V: ${{ steps.versions.outputs.base_manifest }}
          HEAD_V: ${{ steps.versions.outputs.head_manifest }}
        run: |
          # Node-based semver compare so prerelease ordering (beta.10 > beta.2,
          # plain X.Y.Z > X.Y.Z-beta.N) follows the spec.
          node -e '
          const cmp = (a, b) => {
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/.exec(v);
              if (!m) throw new Error("not a recognised version: " + v);
              return { M: +m[1], m: +m[2], p: +m[3], pre: m[4] === undefined ? null : +m[4] };
            };
            const A = parse(a), B = parse(b);
            if (A.M !== B.M) return A.M - B.M;
            if (A.m !== B.m) return A.m - B.m;
            if (A.p !== B.p) return A.p - B.p;
            // prerelease < release at the same X.Y.Z
            if (A.pre === null && B.pre === null) return 0;
            if (A.pre === null) return 1;
            if (B.pre === null) return -1;
            return A.pre - B.pre;
          };
          const base = process.env.BASE_V, head = process.env.HEAD_V;
          if (cmp(head, base) > 0) {
            console.log("OK: " + base + " → " + head);
          } else {
            console.error("::error::PR version " + head + " is not strictly greater than base " + base + ".");
            process.exit(1);
          }'
