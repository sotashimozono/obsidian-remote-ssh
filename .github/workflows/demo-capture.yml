name: Demo capture (GIF -> media branch)

# Scripted walkthrough of the plugin UI, recorded as a GIF and pushed
# to the orphan `media` branch. The README embeds the GIF via the raw
# GitHub URL so it stays up to date without binary files on main.
#
# Run manually whenever the plugin UI changes enough to warrant a fresh
# recording. Not triggered on every push - a 1 MB GIF in CI is cheap
# to produce but wasteful to regenerate nightly.
#
# Result:
#   https://raw.githubusercontent.com/sotashimozono/obsidian-remote-ssh/media/demo.gif

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to force-push to the media branch

concurrency:
  group: demo-capture
  cancel-in-progress: true

jobs:
  capture:
    name: Record demo + push GIF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build plugin
        run: node esbuild.config.mjs production

      - name: Build server daemon
        run: npm run build:server

      - name: Install Xvfb + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg

      - name: Bring up test sshd
        run: npm run sshd:start

      # Cache key v2: previous v1 entry was poisoned by a curl run that
      # saved a "Not Found" HTML body as Obsidian.AppImage (no `-f`),
      # which then survived in the cache and broke every later run.
      - name: Cache Obsidian AppImage
        id: obsidian-cache
        uses: actions/cache@v6
        with:
          path: ~/obsidian/Obsidian.AppImage
          key: obsidian-appimage-1.8.9-v2

      - name: Download Obsidian AppImage
        if: steps.obsidian-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/obsidian
          # `-f` makes curl exit non-zero on HTTP 4xx/5xx instead of
          # writing the error body to disk. Try the 1.8.9 mirror first,
          # fall back to 1.7.7 only if that fails.
          curl -fL -o ~/obsidian/Obsidian.AppImage \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.8.9/Obsidian-1.8.9.AppImage" \
            || curl -fL -o ~/obsidian/Obsidian.AppImage \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.7.7/Obsidian-1.7.7.AppImage"
          chmod +x ~/obsidian/Obsidian.AppImage

      - name: Verify AppImage is a real ELF binary
        # Belt-and-braces guard: if the cached entry (or a fresh
        # download) ever turns out to be HTML/text again, fail loudly
        # here instead of silently in --appimage-extract.
        run: |
          file ~/obsidian/Obsidian.AppImage
          file ~/obsidian/Obsidian.AppImage | grep -q 'ELF .* executable'

      - name: Extract AppImage (no FUSE in CI)
        run: |
          cd ~/obsidian
          ./Obsidian.AppImage --appimage-extract

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run demo walkthrough
        # No continue-on-error: a walkthrough crash means the GIF
        # would be missing frames anyway, and a real failure should
        # fail the workflow loudly.
        env:
          OBSIDIAN_PATH: ~/obsidian/squashfs-root/obsidian
          DISPLAY: ':99'
          # demo.spec.ts is `testIgnore`d by default so the recorder never
          # runs inside the behavioural E2E suite. This is the one place that
          # opts it back in. Without this the walkthrough would silently match
          # ZERO tests and the GIF would never regenerate.
          E2E_DEMO: '1'
        run: npx playwright test --config e2e/playwright.config.ts demo.spec.ts

      - name: Stitch screencast frames into a GIF (two-pass palettegen)
        # x11grab + Electron + CDP doesn't paint to display :99 in
        # this Xvfb harness — recordings come out solid black. CDP
        # `Page.startScreencast` (driven by the spec) does work and
        # gives many natural-rate frames per transition.
        #
        # The spec writes `e2e/demo-screenshots/concat.txt` with
        # per-frame `duration` lines reflecting the original capture
        # cadence; here ffmpeg resamples to a fixed 10 fps for a
        # smooth GIF. The fps filter smooths through any irregular
        # capture spacing without inflating file size.
        run: |
          CONCAT="$PWD/e2e/demo-screenshots/concat.txt"
          if [ ! -s "$CONCAT" ]; then
            echo "::error::concat.txt missing or empty — spec didn't produce frames"
            exit 1
          fi
          echo "frame count: $(grep -c '^file ' "$CONCAT")"
          head -10 "$CONCAT"
          echo "..."

          # Pass 1: build an optimised palette across all frames.
          ffmpeg -y -f concat -safe 0 -i "$CONCAT" \
            -vf "fps=10,scale=800:-1:flags=lanczos,palettegen=stats_mode=diff" \
            /tmp/palette.png

          # Pass 2: apply the palette with Bayer dithering at 10 fps.
          # -loop 0 makes the GIF loop forever in viewers.
          ffmpeg -y -f concat -safe 0 -i "$CONCAT" \
            -i /tmp/palette.png \
            -lavfi "fps=10,scale=800:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
            -loop 0 /tmp/demo.gif

          ls -la /tmp/demo.gif

      - name: Push GIF to media branch
        # Single-commit force-push to an orphan branch keeps the main
        # repo free of binary churn. Raw URL stays stable across runs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp
          mkdir media-push
          cd media-push
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          cp /tmp/demo.gif demo.gif
          git add demo.gif
          git commit -m "chore: update demo.gif [skip ci]"
          git push --force origin HEAD:media

      - name: Tear down test sshd
        if: always()
        run: npm run sshd:stop

      - name: Upload Playwright screenshots (debug)
        # CDP-captured screenshots are the source frames the GIF was
        # stitched from — keep them around for 3 days for debugging.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshots-${{ github.run_id }}
          path: plugin/e2e/demo-screenshots/
          retention-days: 3
          if-no-files-found: warn
